<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="arr-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
<marker id="arr-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker>
<marker id="arr-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4BA3"/></marker>
</defs>
<rect x="0" y="0" width="1100" height="560" fill="white"/>
<text x="550.0" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a" font-style="normal">Does meta-learning help detect anomalies in drifting industrial sensor streams?</text>
<text x="550.0" y="66" font-size="14" font-weight="normal" text-anchor="middle" fill="#444" font-style="normal">66-paper review  →  benchmarking protocol  →  DAMAD, a drift-aware meta-adaptive detector  →  19,650 streaming runs on 8 public benchmarks</text>
<rect x="20" y="90" width="346" height="420" rx="10" fill="#DCE9F7" stroke="#3C6EA5" stroke-width="2"/>
<text x="34" y="114" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a" font-style="normal">The problem and the gap</text>
<text x="34" y="136.5" font-size="13.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">Plants stream thousands of sensor readings,</text>
<text x="34" y="154.32" font-size="13.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">faults are rarely labelled, and the data keep</text>
<text x="34" y="172.14" font-size="13.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">drifting after deployment.</text>
<text x="34" y="189.96" font-size="13.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal"></text>
<text x="34" y="207.78" font-size="13.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">Systematic review of 66 papers (2020–2025):</text>
<text x="34" y="225.6" font-size="13.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">every meta-learning detector is trained offline</text>
<text x="34" y="243.42000000000002" font-size="13.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">and never updated; every streaming detector</text>
<text x="34" y="261.24" font-size="13.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">does not meta-learn.</text>
<text x="38" y="352" font-size="12.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">Taxonomy: paradigm × streaming capability</text>
<rect x="38" y="365" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="90" y="365" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="142" y="365" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="194" y="365" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="38" y="391" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="90" y="391" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="142" y="391" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="194" y="391" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="38" y="417" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="90" y="417" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="142" y="417" width="52" height="26" fill="#C9DAF0" stroke="#3C6EA5" stroke-width="0.6"/>
<rect x="194" y="417" width="52" height="26" fill="#F3B0A3" stroke="#3C6EA5" stroke-width="0.6"/>
<text x="260" y="420" font-size="12.5" font-weight="bold" text-anchor="start" fill="#C0392B" font-style="normal">the online</text>
<text x="260" y="437" font-size="12.5" font-weight="bold" text-anchor="start" fill="#C0392B" font-style="normal">meta-adaptive</text>
<text x="260" y="454" font-size="12.5" font-weight="bold" text-anchor="start" fill="#C0392B" font-style="normal">cell is empty</text>
<text x="38" y="485" font-size="11.5" font-weight="normal" text-anchor="start" fill="#555" font-style="italic">No published method is few-shot, drift-aware, online.</text>
<rect x="377" y="90" width="346" height="420" rx="10" fill="#FBE6D4" stroke="#C96A2B" stroke-width="2"/>
<text x="391" y="114" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a" font-style="normal">DAMAD: adapt only on real change</text>
<circle cx="411" cy="156" r="14" fill="#C96A2B"/>
<text x="411" y="161" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-style="normal">1</text>
<text x="435" y="161" font-size="13" font-weight="normal" text-anchor="start" fill="#222" font-style="normal">Score windows with a meta-learned VAE</text>
<line x1="411" y1="170" x2="411" y2="200" stroke="#C96A2B" stroke-width="2"/>
<circle cx="411" cy="214" r="14" fill="#C96A2B"/>
<text x="411" y="219" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-style="normal">2</text>
<text x="435" y="219" font-size="13" font-weight="normal" text-anchor="start" fill="#222" font-style="normal">Watch the model&#x27;s residual with ADWIN</text>
<line x1="411" y1="228" x2="411" y2="258" stroke="#C96A2B" stroke-width="2"/>
<circle cx="411" cy="272" r="14" fill="#C96A2B"/>
<text x="411" y="277" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-style="normal">3</text>
<text x="435" y="277" font-size="13" font-weight="normal" text-anchor="start" fill="#222" font-style="normal">On a confirmed change: K gradient steps</text>
<line x1="411" y1="286" x2="411" y2="316" stroke="#C96A2B" stroke-width="2"/>
<circle cx="411" cy="330" r="14" fill="#C96A2B"/>
<text x="411" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-style="normal">4</text>
<text x="435" y="335" font-size="13" font-weight="normal" text-anchor="start" fill="#222" font-style="normal">Recalibrate the extreme-value threshold</text>
<line x1="411" y1="344" x2="411" y2="374" stroke="#C96A2B" stroke-width="2"/>
<circle cx="411" cy="388" r="14" fill="#C96A2B"/>
<text x="411" y="393" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-style="normal">5</text>
<text x="435" y="393" font-size="13" font-weight="normal" text-anchor="start" fill="#222" font-style="normal">Keep the old model if it still fits better</text>
<text x="395" y="462" font-size="12" font-weight="normal" text-anchor="start" fill="#555" font-style="italic">Past regimes are kept in memory and replayed</text>
<text x="395" y="480" font-size="12" font-weight="normal" text-anchor="start" fill="#555" font-style="italic">during meta-updates, so nothing is forgotten.</text>
<rect x="734" y="90" width="346" height="420" rx="10" fill="#DFF2E1" stroke="#2E8B57" stroke-width="2"/>
<text x="748" y="114" font-size="15" font-weight="bold" text-anchor="start" fill="#1a1a1a" font-style="normal">What the 19,650 runs say</text>
<text x="752" y="152" font-size="13" font-weight="bold" text-anchor="start" fill="#222" font-style="normal">False alarms on normal steps after drift</text>
<text x="752" y="176" font-size="12.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">static / adapt-once</text>
<rect x="884" y="164" width="120" height="16" fill="#eee" stroke="#999" stroke-width="0.8"/>
<rect x="884" y="167.2" width="120" height="12.8" fill="#C0392B"/>
<text x="1012" y="177" font-size="12.5" font-weight="bold" text-anchor="start" fill="#C0392B" font-style="normal">73–87 %</text>
<text x="752" y="202" font-size="12.5" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">DAMAD</text>
<rect x="884" y="190" width="120" height="16" fill="#eee" stroke="#999" stroke-width="0.8"/>
<rect x="884" y="202.24" width="120" height="3.76" fill="#2E8B57"/>
<text x="1012" y="203" font-size="12.5" font-weight="bold" text-anchor="start" fill="#2E8B57" font-style="normal">17–30 %</text>
<text x="752" y="246" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">Recovers within 230–440 windows and has the</text>
<text x="752" y="265" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">best pooled F1 under all four drift patterns.</text>
<text x="752" y="284" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal"></text>
<text x="752" y="303" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">Without drift, a static autoencoder is as good</text>
<text x="752" y="322" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">as any meta-learned detector on 6 of 8 datasets:</text>
<text x="752" y="341" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">the initialisation is not the bottleneck.</text>
<text x="752" y="360" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal"></text>
<text x="752" y="379" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">Threshold recalibration and the residual-side</text>
<text x="752" y="398" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">gate carry the result; which meta-learner is</text>
<text x="752" y="417" font-size="13" font-weight="normal" text-anchor="start" fill="#333" font-style="normal">used is secondary.</text>
<text x="550.0" y="542" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555" font-style="normal">SWaT · WADI · HAI 21.03 · SMAP · MSL · SMD · SKAB · PSM   |   5 seeds · 4 drift patterns · 8 baselines · 10 ablations   |   code and every table released</text>
</svg>